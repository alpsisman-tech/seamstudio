# seam® Studio — static site (no build step)
[build]
  publish = "."

# Netlify serves 404.html automatically for unmatched paths.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
